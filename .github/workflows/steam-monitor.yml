name: Steam Monitor

on:
  schedule:
    - cron: '*/10 * * * *' # Ejecutar cada 10 minutos
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install
          npm install playwright-extra puppeteer-extra-plugin-stealth

      - name: Install Playwright Chromium only
        run: npx playwright install chromium --with-deps

      - name: Run Steam Monitor with XVFB
        env:
          WEBHOOK_URLS_CHANGES: ${{ secrets.WEBHOOK_URLS_CHANGES }}
          WEBHOOK_URL_ERRORS: ${{ secrets.WEBHOOK_URL_ERRORS }}
        run: xvfb-run --auto-servernum node monitor.js
        
      - name: Upload Debug Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_carga.png
          if-no-files-found: ignore

      - name: Commit estado.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "Update estado.json" && git push)
